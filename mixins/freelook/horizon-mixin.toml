[mod]
id = "freelook"
version = "0.4.0"
priority = 100

# Pinned to Nightly 2026-11-08 (fdc87ae). The key, wheel, mods list and
# distance are the game's named hook points from native-hooks.json, so a move
# of those functions does not break the mod; the view and the turn are private
# methods ("perspective.rs", the rest of `game.rs` in older builds), which only
# this exact source has.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "freelook"
source = "runtime.rs"

# The freelook key goes down or up (Options > Mods lists it with its default).
[[injection]]
id = "key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# While it is held, the wheel changes the camera's distance, not the hotbar.
[[injection]]
id = "wheel"
hook = "wheel"
hook_version = 1
kind = "HEAD"
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# Freelook's row in Options > Mods.
[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::mod_api::NativeMod>", value = "&mut *mods" },
]

# The distance the held camera asks for, before a wall pulls it in.
[[injection]]
id = "distance"
hook = "camera_distance"
hook_version = 1
kind = "HEAD"
helper = "distance.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "distance", ty = "&mut f32", value = "&mut *distance" },
]

# The view: third person, looked around from the camera's angles while held.
[[injection]]
id = "camera"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::camera_view"
helper = "camera.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "partial", ty = "f32", value = "partial" },
]

# The mouse turns the camera's angles, not the player's, while held.
[[injection]]
id = "turn"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::turn_player"
helper = "turn.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "xo", ty = "f64", value = "xo" },
  { name = "yo", ty = "f64", value = "yo" },
]
